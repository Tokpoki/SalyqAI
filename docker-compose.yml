services:
  backend:
    build: ./backend
    container_name: salyq-backend
    ports:
      - "8000:8000"
    volumes:
      - salyq-data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/salyq.db
      - CHROMA_PATH=/data/chroma
      - CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/app
      args:
        VITE_API_URL: http://localhost:8000
    container_name: salyq-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  salyq-data:
