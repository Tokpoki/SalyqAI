app = 'salyq-ai-backend'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DB_PATH = "/data/salyq.db"
  CHROMA_PATH = "/data/chroma"
  CORS_ORIGINS = "https://salyq-ai.vercel.app,http://localhost:3000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "salyq_data"
  destination = "/data"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
